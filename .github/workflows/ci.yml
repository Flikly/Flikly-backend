# 📁 .github/workflows/ci.yml

name: CI

on:
  push:
    branches: [ "main" ]  # main 브랜치에 push 될 때 실행

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: 저장소 코드 받아오기
        uses: actions/checkout@v3

      - name: JDK 설정
        uses: actions/setup-java@v3
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Gradle 빌드
        run: ./gradlew build
