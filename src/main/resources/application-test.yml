spring:
  # 데이터소스 설정
  datasource:
    url: jdbc:h2:mem:testdb;MODE=MySQL
    driver-class-name: org.h2.Driver
    username: sa
    password:
  
  # JPA 설정
  jpa:
    hibernate:
      ddl-auto: create-drop  # 테스트 시작 시 스키마 생성, 종료 시 삭제
    properties:
      hibernate:
        format_sql: true
        show_sql: true
        dialect: org.hibernate.dialect.H2Dialect
    open-in-view: false  # OSIV 패턴 비활성화 (성능 최적화)
  
  # H2 콘솔 설정
  h2:
    console:
      enabled: true
      path: /h2-console
  
  # 테스트 환경임을 명시
  profiles:
    active: test

# 로깅 설정
logging:
  level:
    org.hibernate.SQL: debug  # SQL 쿼리 로깅
    org.hibernate.type.descriptor.sql: trace  # SQL 파라미터 로깅
    com.flikly.backend: debug  # 애플리케이션 로그 레벨

# 서버 포트 설정 (테스트용으로 다른 포트 사용 가능)
server:
  port: 8081